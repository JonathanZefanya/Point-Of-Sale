name: pos

services:
  pos-mysql:
    image: mysql:8.4
    container_name: pos-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: localhost
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Jakarta
    command: ["--skip-name-resolve"]
    volumes:
      - pos_mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-init/init.sql:ro
      - ./docker/mysql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    # Jangan pernah tambahkan `ports:` di sini.
    networks:
      pos_db:
        ipv4_address: 172.21.0.30

  pos-restapi:
    build:
      context: .
      dockerfile: docker/restapi/Dockerfile
    container_name: pos-restapi
    restart: unless-stopped
    depends_on:
      pos-mysql:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Jakarta
    ports:
      - "8000:8000"
    volumes:
      - ./pos-restapi:/var/www/html
      - /var/www/html/vendor
    networks:
      pos_app:
        ipv4_address: 172.20.0.20
      pos_db:
        ipv4_address: 172.21.0.20

  pos-web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: pos-web
    restart: unless-stopped
    depends_on:
      - pos-restapi
    environment:
      # Source di-mount dari host Windows/macOS: watcher butuh polling agar HMR jalan
      VITE_USE_POLLING: "1"
    ports:
      - "5173:5173"
    volumes:
      - ./pos-web:/app
      - /app/node_modules
    networks:
      pos_app:
        ipv4_address: 172.20.0.10

networks:
  pos_app:
    name: pos_app
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  pos_db:
    name: pos_db
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.21.0.0/24

volumes:
  pos_mysql_data:
    name: pos_mysql_data
